<!doctype html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OLED Chizma</title>
<style>
:root{--bg:#0f1115;--panel:#1a1e27;--line:#2c3240;--tx:#e8eaf0;--mut:#8a90a0;--acc:#4cc3ff}
*{box-sizing:border-box}
body{margin:0;font:15px system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;align-items:center;padding:16px;gap:12px}
h1{font-size:18px;margin:4px 0}
#wrap{width:min(100%,768px);aspect-ratio:2/1;background:#000;border-radius:12px;padding:10px;box-shadow:0 0 0 2px var(--line)}
canvas{width:100%;height:100%;image-rendering:pixelated;touch-action:none;cursor:crosshair;display:block}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:min(100%,768px)}
button,label.b{background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:9px 13px;font:inherit;cursor:pointer;user-select:none}
button.on{border-color:var(--acc);color:var(--acc)}
input[type=text]{flex:1;min-width:140px;background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:9px}
#st{color:var(--mut);font-size:13px;min-height:1.2em}
</style></head><body>
<h1>OLED Chizma</h1>
<div class="bar"><button id="con">🔵 Bluetooth orqali ulanish</button></div>
<div id="wrap"><canvas id="c" width="128" height="64"></canvas></div>
<div class="bar">
<button id="pen" class="on">✏️ Qalam</button>
<button id="era">🧽 O'chirg'ich</button>
<button id="sz">Qalinlik: 1</button>
<button id="inv">◐ Teskari</button>
<button id="clr">🗑 Tozalash</button>
<label class="b">🖼 Rasm<input id="img" type="file" accept="image/*" hidden></label>
</div>
<div class="bar"><input id="txt" type="text" placeholder="Matn yozing..."><button id="put">Ekranga yozish</button></div>
<div id="st">...</div>
<script>
const W=128,H=64,px=new Uint8Array(W*H);
const $=id=>document.getElementById(id);
const c=$('c'),g=c.getContext('2d'),im=g.createImageData(W,H);
let tool=1,size=1,down=false,lx=0,ly=0,dirty=false;
const st=t=>$('st').textContent=t;

function render(){
  for(let i=0;i<W*H;i++){const o=i*4,v=px[i];
    im.data[o]=v?150:0;im.data[o+1]=v?220:0;im.data[o+2]=v?255:0;im.data[o+3]=255;}
  g.putImageData(im,0,0);
}
function changed(){dirty=true;render();}
function dot(x,y){
  const r=size-1;
  for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    if(dx*dx+dy*dy>r*r+r)continue;
    const X=x+dx,Y=y+dy;
    if(X>=0&&X<W&&Y>=0&&Y<H)px[Y*W+X]=tool;
  }
}
function line(x0,y0,x1,y1){
  let dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,e=dx+dy;
  for(;;){dot(x0,y0);if(x0===x1&&y0===y1)break;const e2=2*e;
    if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}
}
function pos(e){
  const r=c.getBoundingClientRect();
  return [Math.min(W-1,Math.max(0,Math.floor((e.clientX-r.left)/r.width*W))),
          Math.min(H-1,Math.max(0,Math.floor((e.clientY-r.top)/r.height*H)))];
}
c.addEventListener('pointerdown',e=>{down=true;c.setPointerCapture(e.pointerId);[lx,ly]=pos(e);dot(lx,ly);changed();});
c.addEventListener('pointermove',e=>{if(!down)return;const[x,y]=pos(e);line(lx,ly,x,y);lx=x;ly=y;changed();});
['pointerup','pointercancel'].forEach(t=>c.addEventListener(t,()=>down=false));

function setTool(t){tool=t;$('pen').classList.toggle('on',t===1);$('era').classList.toggle('on',t===0);}
$('pen').onclick=()=>setTool(1);
$('era').onclick=()=>setTool(0);
$('sz').onclick=()=>{size=size%5+1;$('sz').textContent='Qalinlik: '+size;};
$('clr').onclick=()=>{px.fill(0);changed();};
$('inv').onclick=()=>{for(let i=0;i<px.length;i++)px[i]^=1;changed();};

// Matnni ekranga yozish
$('put').onclick=()=>{
  const t=$('txt').value.trim();if(!t)return;
  const oc=document.createElement('canvas');oc.width=W;oc.height=H;const o=oc.getContext('2d');
  let f=40;do{o.font='bold '+f+'px sans-serif';f--;}while(o.measureText(t).width>W-4&&f>8);
  o.fillStyle='#000';o.fillRect(0,0,W,H);o.fillStyle='#fff';o.textAlign='center';o.textBaseline='middle';
  o.fillText(t,W/2,H/2+1);
  const d=o.getImageData(0,0,W,H).data;
  for(let i=0;i<W*H;i++)if(d[i*4]>110)px[i]=1;
  changed();
};

// Rasm yuklash: 128x64 ga moslab, Floyd-Steinberg bilan oq-qora qilinadi
$('img').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const img=new Image();img.onload=()=>{
    const oc=document.createElement('canvas');oc.width=W;oc.height=H;const o=oc.getContext('2d');
    o.fillStyle='#000';o.fillRect(0,0,W,H);
    const k=Math.min(W/img.width,H/img.height),w=img.width*k,h=img.height*k;
    o.drawImage(img,(W-w)/2,(H-h)/2,w,h);
    const d=o.getImageData(0,0,W,H).data,l=new Float32Array(W*H);
    for(let i=0;i<W*H;i++)l[i]=0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2];
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x,v=l[i]>127?255:0,err=l[i]-v;px[i]=v?1:0;
      if(x+1<W)l[i+1]+=err*7/16;
      if(y+1<H){if(x>0)l[i+W-1]+=err*3/16;l[i+W]+=err*5/16;if(x+1<W)l[i+W+1]+=err/16;}}
    changed();URL.revokeObjectURL(img.src);e.target.value='';
  };img.src=URL.createObjectURL(f);
};

// 128x64 -> 1024 bayt (har qator 16 bayt, chapdagi piksel = yuqori bit)
function pack(){
  const b=new Uint8Array(1024);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(px[y*W+x])b[y*16+(x>>3)]|=0x80>>(x&7);
  return b;
}
function unpack(b){for(let y=0;y<H;y++)for(let x=0;x<W;x++)px[y*W+x]=(b[y*16+(x>>3)]>>(7-(x&7)))&1;render();}
render();
// ---- Bluetooth (BLE) orqali yuborish ----
const XIZMAT='7a1e0001-5c3b-4c2e-9d7a-0b1e5d0e1ed0', QATOR='7a1e0002-5c3b-4c2e-9d7a-0b1e5d0e1ed0';
let ch=null,busy=false,sent=null;
if(!navigator.bluetooth)st('⚠️ Bu brauzer Bluetooth ni qo‘llamaydi. Chrome yoki Edge da oching.');
else st('“Bluetooth orqali ulanish” tugmasini bosing.');
let dev=null;
async function ulan(){
  const srv=await dev.gatt.connect();
  ch=await (await srv.getPrimaryService(XIZMAT)).getCharacteristic(QATOR);
  sent=null;dirty=true;$('con').classList.add('on');   // ulangach butun rasm qayta yuboriladi
  st('✅ Ulangan: '+dev.name+'. Chizishni boshlang!');
}
// Ulanish uzilsa, o'zi qayta ulanadi (10 marta urinadi)
async function qaytaUlan(){
  ch=null;$('con').classList.remove('on');
  for(let i=1;i<=10&&dev;i++){
    st('🔄 Ulanish uzildi, qayta ulanmoqda... ('+i+'/10)');
    try{await ulan();return;}catch(e){await new Promise(r=>setTimeout(r,1000));}
  }
  st('⚠️ Ulanib bo‘lmadi. “Bluetooth orqali ulanish” ni qayta bosing.');
}
$('con').onclick=async()=>{
  try{
    st('Qurilma tanlang: OLED-Chizma-BLE');
    const yangi=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'OLED'},{services:[XIZMAT]}],optionalServices:[XIZMAT]});
    if(dev!==yangi){dev=yangi;dev.addEventListener('gattserverdisconnected',qaytaUlan);}
    await ulan();
  }catch(e){st('⚠️ '+e.message);}
};
async function write(buf){
  if(ch.writeValueWithoutResponse)return ch.writeValueWithoutResponse(buf);
  return ch.writeValue(buf);
}
async function pump(){
  if(ch&&dirty&&!busy){busy=true;dirty=false;
    try{
      const b=pack(),rows=[];
      for(let y=0;y<64;y++){
        let same=!!sent;
        if(sent)for(let i=0;i<16;i++)if(sent[y*16+i]!==b[y*16+i]){same=false;break;}
        if(!same)rows.push(y);
      }
      // 1 paket = 1 qator (17 bayt): hamma brauzer va MTU uchun xavfsiz
      for(const y of rows){const p=new Uint8Array(17);p[0]=y;p.set(b.subarray(y*16,y*16+16),1);await write(p);}
      sent=b;
    }catch(e){dirty=true;st('⚠️ Yuborishda xato: '+e.message);await new Promise(r=>setTimeout(r,300));}
    busy=false;}
  requestAnimationFrame(pump);
}
pump();
</script></body></html>
